<!DOCTYPE html>
<!-- data-theme is stamped in the markup below, not left to js/common.js to set
     once the main bundle evaluates. No :root rule declares a colour any more —
     every palette belongs to its theme, by design — so a root element matching
     no theme resolves background:var(--bg-primary) and color:var(--text-primary)
     to nothing at all: an unstyled page until 468 KB of JavaScript has parsed,
     and no palette at all if it never does. Minimal is the default common.js
     falls back to, so stamping it costs nothing, and login.html does the same.
     /theme-boot.js, loaded further down, then replaces it with the stored theme
     before anything is drawn — this attribute is what covers the window before
     that file runs, and what stands if it fails. -->
<html lang="en" data-theme="minimal">

    <meta name="apple-mobile-web-app-title" content="Audiogravity">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#12141c">
    <!-- CSP: this meta tag is the policy in production too — the box's server.py sends
         no CSP header, and no Nginx serves the UI (checked on 2026-09-27; the comment
         here used to say otherwise). 'unsafe-eval' is needed for Vite HMR, so it ships:
         BACKLOG — audiogravity.ops/BACKLOG.md, "La CSP de production…".
         img-src is 'self': the in-app manual's figures come from the box's own copy
         (a box repointing AG_CONFIG.manualBase must allow that origin).
         Scripts and styles may come from no third party: Chart.js, CodeMirror and xterm.js
         are npm dependencies, served by the box like the rest of the bundle. They came
         from jsDelivr, which held the first paint and the start of the app on a CDN
         round trip and ran unhashed code in the admin's session; an allowed CDN is
         also any package published on it. js/module-imports.test.js keeps it out. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' ws: wss: * http://*:* https://*:*;
        frame-src 'self' * http://*:* https://*:*;
        child-src 'self' * http://*:* https://*:*;
        worker-src 'self';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- Stamps the stored theme and dark mode on the root element before the
         first paint. Must stay a separate file loaded synchronously: the policy
         above allows no inline script, and a deferred or module script would run
         after the page has already been drawn. -->
    <script src="/theme-boot.js"></script>
